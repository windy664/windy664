name: Refresh profile

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/profile.yml'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: profile-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check description synchronization
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Update blog, projects, and banner
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contributions.svg?color_snake=#287fa9&color_dots=#eef7fc,#b6dce8,#80c3d4,#4b9db6,#287fa9
            assets/contributions-dark.svg?palette=github-dark&color_snake=#86c8e9&color_dots=#132635,#204759,#2f6e84,#4d9bb6,#86c8e9
      - name: Validate generated images
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for name in ('compact-header-light.svg', 'compact-header-dark.svg', 'contributions.svg', 'contributions-dark.svg'):
              path = Path('assets') / name
              assert path.stat().st_size > 100, name
              ET.parse(path)
          for kind in ('projects', 'posts'):
              for index in range(2):
                  for theme in ('light', 'dark'):
                      path = Path('assets') / f'profile-{kind}-{index}-{theme}.svg'
                      assert path.stat().st_size > 100, path
                      ET.parse(path)
          for link in ('blog', 'code', 'rss'):
              for theme in ('light', 'dark'):
                  ET.parse(Path('assets') / f'profile-link-{link}-{theme}.svg')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/compact-header-*.svg assets/profile-data.json assets/profile-translations.json assets/profile-projects-*.svg assets/profile-posts-*.svg assets/profile-link-*.svg assets/contributions*.svg
          if git diff --cached --quiet; then
            echo 'Profile is already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh profile content and contribution animation'
          git pull --rebase origin master
          git push origin HEAD:master
