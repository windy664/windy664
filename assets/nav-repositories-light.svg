<svg xmlns="http://www.w3.org/2000/svg" width="310" height="64" viewBox="0 0 310 64" role="img" aria-labelledby="title"><title id="title">REPOSITORIES</title><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#116a74"/><stop offset=".36" stop-color="#2e1593"/><stop offset=".7" stop-color="#931551"/><stop offset="1" stop-color="#865613"/></linearGradient><radialGradient id="violet"><stop stop-color="#361593" stop-opacity=".12"/><stop offset="1" stop-color="#361593" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#146b6a" stop-opacity=".08"/><stop offset="1" stop-color="#146b6a" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#363f72" stroke-opacity=".07"/></pattern></defs><defs><clipPath id="panel"><rect width="310" height="64" rx="24"/></clipPath></defs><g clip-path="url(#panel)"><rect x="1" y="1" width="308" height="62" rx="24" fill="#f8f9ff" stroke="#d8ddeb"/><style>
    @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes drift { 0%,100% { transform:translate(0,0) } 50% { transform:translate(-32px,14px) } }
    @keyframes orbit { to { transform:rotate(360deg) } }
    @keyframes borderflow { to { stroke-dashoffset:-1000 } }
    @keyframes scan { 0%,15% { transform:translateX(-110%) } 75%,100% { transform:translateX(110%) } }
    @keyframes arrow { 0%,100% { transform:translate(0,0) } 50% { transform:translate(3px,-3px) } }
    @keyframes spectrum { 0%,100% { stop-color:#116a74 } 33% { stop-color:#3b1593 } 66% { stop-color:#93154b } }
    .pulse { animation:breathe 4s ease-in-out infinite }
    .drift { animation:drift 12s ease-in-out infinite }
    .orbit { animation:orbit 24s linear infinite }
    .reverse { animation-direction:reverse; animation-duration:18s }
    .flow { animation:borderflow 16s linear infinite }
    .scan { animation:scan 9s ease-in-out infinite; transform-box:view-box }
    .arrow { animation:arrow 3s ease-in-out infinite }
    #spectrum stop { animation:spectrum 12s ease-in-out infinite }
    #spectrum stop:nth-child(2) { animation-delay:-3s }
    #spectrum stop:nth-child(3) { animation-delay:-6s }
    #spectrum stop:nth-child(4) { animation-delay:-9s }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important } .scan { display:none } }
    </style><defs><linearGradient id="beam"><stop stop-color="#12687d" stop-opacity="0"/><stop offset=".5" stop-color="#281593" stop-opacity=".09"/><stop offset="1" stop-color="#931554" stop-opacity="0"/></linearGradient></defs><g class="scan"><path d="M0 0H49.6L93.0 64H43.400000000000006Z" fill="url(#beam)"/></g><text x="24" y="38" font-family="Consolas,monospace" font-size="14" fill="#106870" font-weight="700" >REPOSITORIES</text><text x="285" y="38" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#106870" font-weight="400" text-anchor="end" class="arrow">↗</text><rect x="1.5" y="1.5" width="307" height="61" rx="23" fill="none" stroke="url(#spectrum)" stroke-width="1.3" stroke-opacity=".55" stroke-dasharray="90 410" class="flow"/></g></svg>
