<svg xmlns="http://www.w3.org/2000/svg" width="480" height="446" viewBox="0 0 480 446" role="img" aria-labelledby="title"><title id="title">Java at heart. Curious by nature. Backend systems, AI agents, photography, video editing, and design.</title><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ee7f7"/><stop offset=".36" stop-color="#9c83ff"/><stop offset=".7" stop-color="#fb77b6"/><stop offset="1" stop-color="#ffc778"/></linearGradient><radialGradient id="violet"><stop stop-color="#7951e8" stop-opacity=".36"/><stop offset="1" stop-color="#7951e8" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#27cecb" stop-opacity=".2"/><stop offset="1" stop-color="#27cecb" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#929acb" stroke-opacity=".07"/></pattern></defs><defs><clipPath id="panel"><rect width="480" height="446" rx="24"/></clipPath></defs><g clip-path="url(#panel)"><rect x="1" y="1" width="478" height="444" rx="24" fill="#0c1020" stroke="#2a304b"/><text x="28" y="40" font-family="Consolas,monospace" font-size="12" fill="#c4b5fd" font-weight="700" >01 / BEHIND THE CODE</text><text x="28" y="87" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" fill="#eef2ff" font-weight="700" >Java at heart.</text><text x="28" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" fill="#eef2ff" font-weight="700" >Curious by nature.</text><rect x="28" y="162" width="3" height="64" rx="1.5" fill="#75e4ed"/><text x="44" y="176" font-family="Consolas,monospace" font-size="11" fill="#75e4ed" font-weight="700" >BUILD</text><text x="44" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >Minecraft plugins, backend systems,</text><text x="44" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >and cross