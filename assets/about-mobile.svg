<svg xmlns="http://www.w3.org/2000/svg" width="480" height="446" viewBox="0 0 480 446" role="img" aria-labelledby="title"><title id="title">Java at heart. Curious by nature. Backend systems, AI agents, photography, video editing, and design.</title><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ee7f7"/><stop offset=".36" stop-color="#9c83ff"/><stop offset=".7" stop-color="#fb77b6"/><stop offset="1" stop-color="#ffc778"/></linearGradient><radialGradient id="violet"><stop stop-color="#7951e8" stop-opacity=".36"/><stop offset="1" stop-color="#7951e8" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#27cecb" stop-opacity=".2"/><stop offset="1" stop-color="#27cecb" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#929acb" stroke-opacity=".07"/></pattern></defs><defs><clipPath id="panel"><rect width="480" height="446" rx="24"/></clipPath></defs><g clip-path="url(#panel)"><rect x="1" y="1" width="478" height="444" rx="24" fill="#0c1020" stroke="#2a304b"/><style>
    @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes drift { 0%,100% { transform:translate(0,0) } 50% { transform:translate(-32px,14px) } }
    @keyframes orbit { to { transform:rotate(360deg) } }
    @keyframes borderflow { to { stroke-dashoffset:-1000 } }
    @keyframes scan { 0%,15% { transform:translateX(-110%) } 75%,100% { transform:translateX(110%) } }
    @keyframes arrow { 0%,100% { transform:translate(0,0) } 50% { transform:translate(3px,-3px) } }
    @keyframes spectrum { 0%,100% { stop-color:#5ee7f7 } 33% { stop-color:#b392ff } 66% { stop-color:#ff8abc } }
    .pulse { animation:breathe 4s ease-in-out infinite }
    .drift { animation:drift 12s ease-in-out infinite }
    .orbit { animation:orbit 24s linear infinite }
    .reverse { animation-direction:reverse; animation-duration:18s }
    .flow { animation:borderflow 16s linear infinite }
    .scan { animation:scan 9s ease-in-out infinite; transform-box:view-box }
    .arrow { animation:arrow 3s ease-in-out infinite }
    #spectrum stop { animation:spectrum 12s ease-in-out infinite }
    #spectrum stop:nth-child(2) { animation-delay:-3s }
    #spectrum stop:nth-child(3) { animation-delay:-6s }
    #spectrum stop:nth-child(4) { animation-delay:-9s }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important } .scan { display:none } }
    </style><defs><linearGradient id="beam"><stop stop-color="#8ce8ff" stop-opacity="0"/><stop offset=".5" stop-color="#a393ff" stop-opacity=".09"/><stop offset="1" stop-color="#ff9dce" stop-opacity="0"/></linearGradient></defs><g class="scan"><path d="M0 0H76.8L144.0 446H67.2Z" fill="url(#beam)"/></g><text x="28" y="40" font-family="Consolas,monospace" font-size="12" fill="#c4b5fd" font-weight="700" >01 / BEHIND THE CODE</text><text x="28" y="87" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" fill="#eef2ff" font-weight="700" >Java at heart.</text><text x="28" y="124" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" fill="#eef2ff" font-weight="700" >Curious by nature.</text><rect x="28" y="162" width="3" height="64" rx="1.5" fill="#75e4ed" class="pulse"/><text x="44" y="176" font-family="Consolas,monospace" font-size="11" fill="#75e4ed" font-weight="700" >BUILD</text><text x="44" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >Minecraft plugins, backend systems,</text><text x="44" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >and cross-server data sync.</text><rect x="28" y="256" width="3" height="64" rx="1.5" fill="#c4a4ff" class="pulse"/><text x="44" y="270" font-family="Consolas,monospace" font-size="11" fill="#c4a4ff" font-weight="700" >EXPLORE</text><text x="44" y="296" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >AI agents and automation for coding</text><text x="44" y="320" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >and server operations.</text><rect x="28" y="350" width="3" height="64" rx="1.5" fill="#ff9bc9" class="pulse"/><text x="44" y="364" font-family="Consolas,monospace" font-size="11" fill="#ff9bc9" font-weight="700" >CREATE</text><text x="44" y="390" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >Photography, video editing, and design</text><text x="44" y="414" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#b4bfdc" font-weight="400" >beyond the terminal.</text><rect x="395" y="38" width="2" height="5" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-0.0s"/><rect x="400" y="33" width="2" height="10" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-0.32s"/><rect x="405" y="26" width="2" height="17" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-0.64s"/><rect x="410" y="32" width="2" height="11" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-0.96s"/><rect x="415" y="22" width="2" height="21" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-1.28s"/><rect x="420" y="29" width="2" height="14" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-1.6s"/><rect x="425" y="35" width="2" height="8" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-1.92s"/><rect x="430" y="27" width="2" height="16" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-2.24s"/><rect x="435" y="37" width="2" height="6" rx="1" fill="#a997ff" class="pulse" style="animation-delay:-2.56s"/><rect x="1.5" y="1.5" width="477" height="443" rx="23" fill="none" stroke="url(#spectrum)" stroke-width="1.3" stroke-opacity=".55" stroke-dasharray="90 410" class="flow"/></g></svg>
