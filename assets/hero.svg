<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" role="img" aria-labelledby="title"><title id="title">windy664 — Java, Minecraft &amp; AI agents. Code with logic. Create with color.</title><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ee7f7"/><stop offset=".36" stop-color="#9c83ff"/><stop offset=".7" stop-color="#fb77b6"/><stop offset="1" stop-color="#ffc778"/></linearGradient><radialGradient id="violet"><stop stop-color="#7951e8" stop-opacity=".36"/><stop offset="1" stop-color="#7951e8" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#27cecb" stop-opacity=".2"/><stop offset="1" stop-color="#27cecb" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#929acb" stroke-opacity=".07"/></pattern></defs><defs><clipPath id="panel"><rect width="980" height="400" rx="24"/></clipPath></defs><g clip-path="url(#panel)"><rect x="1" y="1" width="978" height="398" rx="24" fill="#0c1020" stroke="#2a304b"/><style>
    @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
