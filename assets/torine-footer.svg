<svg xmlns="http://www.w3.org/2000/svg" width="980" height="152" viewBox="0 0 980 152" role="img" aria-labelledby="title"><title id="title">Stay curious. Keep building. One more idea. One more line. A whole new world.</title><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5ee7f7"/><stop offset=".36" stop-color="#9c83ff"/><stop offset=".7" stop-color="#fb77b6"/><stop offset="1" stop-color="#ffc778"/></linearGradient><radialGradient id="violet"><stop stop-color="#7951e8" stop-opacity=".36"/><stop offset="1" stop-color="#7951e8" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#27cecb" stop-opacity=".2"/><stop offset="1" stop-color="#27cecb" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#929acb" stroke-opacity=".07"/></pattern></defs><defs><clipPath id="panel"><rect width="980" height="152" rx="24"/></clipPath></defs><g clip-path="url(#panel)"><rect x="1" y="1" width="978" height="150" rx="24" fill="#0c1020" stroke="#2a304b"/><style>
    @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes drift { 0%,100% { transform:translate(0,0) } 50% { transform:translate(-32px,14px) } }
    @keyframes orbit { to { transform:rotate(360deg) } }
    @keyframes borderflow { to { stroke-dashoffset:-1000 } }
    @keyframes scan { 0%,15% { transform:translateX(-110%) } 75%,100% { transform:translateX(110%) } }
    @keyframes arrow { 0%,100% { transform:translate(0,0) } 50% { transform:translate(3px,-3px) } }
    @keyframes spectrum { 0%,100% { stop-color:#5ee7f7 } 33% { stop-color:#b392ff } 66% { stop-color:#ff8abc } }
    .pulse { animation:breathe 4s ease-in-out infinite }
    .drift { animation:drift 12s ease-in-out infinite }
    .orbit { animation:orbit 24s linear infinite }
    .reverse { animation-direction:reverse; animation-duration:18s }
    .flow { animation:borderflow 16s linear infinite }
    .scan { animation:scan 9s ease-in-out infinite; transform-box:view-box }
    .arrow { animation:arrow 3s ease-in-out infinite }
    #spectrum stop { animation:spectrum 12s ease-in-out infinite }
    #spectrum stop:nth-child(2) { animation-delay:-3s }
    #spectrum stop:nth-child(3) { animation-delay:-6s }
    #spectrum stop:nth-child(4) { animation-delay:-9s }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important } .scan { display:none } }
    </style><defs><linearGradient id="beam"><stop stop-color="#8ce8ff" stop-opacity="0"/><stop offset=".5" stop-color="#a393ff" stop-opacity=".09"/><stop offset="1" stop-color="#ff9dce" stop-opacity="0"/></linearGradient></defs><g class="scan"><path d="M0 0H156.8L294.0 152H137.20000000000002Z" fill="url(#beam)"/></g><ellipse class="drift" cx="490" cy="140" rx="450" ry="150" fill="url(#violet)"/><path d="M44 1H936" stroke="url(#spectrum)" stroke-width="2"/><text x="490" y="55" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" fill="url(#spectrum)" font-weight="800" text-anchor="middle" letter-spacing="2">STAY CURIOUS. KEEP BUILDING.</text><text x="490" y="89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" fill="#b4bfdc" font-weight="400" text-anchor="middle">One more idea. One more line. A whole new world.</text><text x="490" y="125" font-family="Consolas,monospace" font-size="10" fill="#8a96b6" font-weight="400" text-anchor="middle" letter-spacing="2">TORINE  /  CODE × CREATIVITY</text><rect x="1.5" y="1.5" width="977" height="149" rx="23" fill="none" stroke="url(#spectrum)" stroke-width="1.3" stroke-opacity=".55" stroke-dasharray="90 410" class="flow"/></g></svg>
