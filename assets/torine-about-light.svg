<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-labelledby="title"><title id="title">Torine — Java at heart. Curious by nature. Building backend systems, exploring AI agents, and creating through photography and design.</title><defs><linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#116a74"/><stop offset=".36" stop-color="#2e1593"/><stop offset=".7" stop-color="#931551"/><stop offset="1" stop-color="#865613"/></linearGradient><radialGradient id="violet"><stop stop-color="#361593" stop-opacity=".12"/><stop offset="1" stop-color="#361593" stop-opacity="0"/></radialGradient><radialGradient id="cyan"><stop stop-color="#146b6a" stop-opacity=".08"/><stop offset="1" stop-color="#146b6a" stop-opacity="0"/></radialGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#363f72" stroke-opacity=".07"/></pattern></defs><defs><clipPath id="panel"><rect width="980" height="330" rx="24"/></clipPath></defs><g clip-path="url(#panel)"><rect x="1" y="1" width="978" height="328" rx="24" fill="#f8f9ff" stroke="#d8ddeb"/><style>
    @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:1 } }
    @keyframes drift { 0%,100% { transform:translate(0,0) } 50% { transform:translate(-32px,14px) } }
    @keyframes orbit { to { transform:rotate(360deg) } }
    @keyframes borderflow { to { stroke-dashoffset:-1000 } }
    @keyframes scan { 0%,15% { transform:translateX(-110%) } 75%,100% { transform:translateX(110%) } }
    @keyframes arrow { 0%,100% { transform:translate(0,0) } 50% { transform:translate(3px,-3px) } }
    @keyframes spectrum { 0%,100% { stop-color:#116a74 } 33% { stop-color:#3b1593 } 66% { stop-color:#93154b } }
    .pulse { animation:breathe 4s ease-in-out infinite }
    .drift { animation:drift 12s ease-in-out infinite }
    .orbit { animation:orbit 24s linear infinite }
    .reverse { animation-direction:reverse; animation-duration:18s }
    .flow { animation:borderflow 16s linear infinite }
    .scan { animation:scan 9s ease-in-out infinite; transform-box:view-box }
    .arrow { animation:arrow 3s ease-in-out infinite }
    #spectrum stop { animation:spectrum 12s ease-in-out infinite }
    #spectrum stop:nth-child(2) { animation-delay:-3s }
    #spectrum stop:nth-child(3) { animation-delay:-6s }
    #spectrum stop:nth-child(4) { animation-delay:-9s }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important } .scan { display:none } }
    </style><defs><linearGradient id="beam"><stop stop-color="#12687d" stop-opacity="0"/><stop offset=".5" stop-color="#281593" stop-opacity=".09"/><stop offset="1" stop-color="#931554" stop-opacity="0"/></linearGradient></defs><g class="scan"><path d="M0 0H156.8L294.0 330H137.20000000000002Z" fill="url(#beam)"/></g><text x="40" y="43" font-family="Consolas,monospace" font-size="13" fill="#2f1593" font-weight="700" >01 / ABOUT TORINE</text><text x="40" y="91" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" fill="#202840" font-weight="700" >Java at heart. Curious by nature.</text><rect x="40" y="128" width="3" height="41" rx="1.5" fill="#106870" class="pulse"/><text x="57" y="143" font-family="Consolas,monospace" font-size="11" fill="#106870" font-weight="700" >BUILD</text><text x="57" y="169" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#485571" font-weight="400" >Minecraft plugins, backend systems, and cross-server data sync.</text><rect x="40" y="192" width="3" height="41" rx="1.5" fill="#411593" class="pulse"/><text x="57" y="207" font-family="Consolas,monospace" font-size="11" fill="#411593" font-weight="700" >EXPLORE</text><text x="57" y="233" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#485571" font-weight="400" >AI agents and automation for coding and server operations.</text><rect x="40" y="256" width="3" height="41" rx="1.5" fill="#93154f" class="pulse"/><text x="57" y="271" font-family="Consolas,monospace" font-size="11" fill="#93154f" font-weight="700" >CREATE</text><text x="57" y="297" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#485571" font-weight="400" >Photography, video editing, and design beyond the terminal.</text><rect x="895" y="38" width="2" height="5" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-0.0s"/><rect x="900" y="33" width="2" height="10" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-0.32s"/><rect x="905" y="26" width="2" height="17" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-0.64s"/><rect x="910" y="32" width="2" height="11" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-0.96s"/><rect x="915" y="22" width="2" height="21" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-1.28s"/><rect x="920" y="29" width="2" height="14" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-1.6s"/><rect x="925" y="35" width="2" height="8" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-1.92s"/><rect x="930" y="27" width="2" height="16" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-2.24s"/><rect x="935" y="37" width="2" height="6" rx="1" fill="#2b1593" class="pulse" style="animation-delay:-2.56s"/><rect x="1.5" y="1.5" width="977" height="327" rx="23" fill="none" stroke="url(#spectrum)" stroke-width="1.3" stroke-opacity=".55" stroke-dasharray="90 410" class="flow"/></g></svg>
