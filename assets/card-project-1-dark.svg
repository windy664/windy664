</style><defs><linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e3db" stop-opacity=".11"/><stop offset="1" stop-color="#67e3db" stop-opacity=".02"/></linearGradient></defs>
