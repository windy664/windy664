<svg xmlns="http://www.w3.org/2000/svg" width="410" height="118" viewBox="0 0 410 118" role="img" aria-labelledby="title"><title id="title">Ru41</title><style>
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-24px,12px)}}
